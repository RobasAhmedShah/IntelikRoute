<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IntelikRoute Public Test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        align-items: center;
        background: #f4f7fb;
        color: #122033;
        display: flex;
        min-height: 100vh;
        margin: 0;
      }

      main {
        margin: auto;
        max-width: 720px;
        padding: 32px;
      }

      h1 {
        font-size: 38px;
        line-height: 1.1;
        margin: 0 0 16px;
      }

      p {
        font-size: 18px;
        line-height: 1.55;
        margin: 0 0 18px;
      }

      dl {
        background: #ffffff;
        border: 1px solid #d8e2ef;
        border-radius: 8px;
        display: grid;
        grid-template-columns: minmax(110px, max-content) 1fr;
        margin: 24px 0 0;
        overflow: hidden;
      }

      dt,
      dd {
        border-bottom: 1px solid #d8e2ef;
        margin: 0;
        padding: 12px 14px;
      }

      dt {
        background: #eef3f8;
        font-weight: 700;
      }

      dd {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        word-break: break-word;
      }

      dt:last-of-type,
      dd:last-of-type {
        border-bottom: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>IntelikRoute is reachable</h1>
      <p>
        This page is served from the Mac through the current routing path. If
        you can see it from outside the office network, the Huawei and inner
        router forwarding chain is working.
      </p>
      <dl>
        <dt>URL</dt>
        <dd id="url">Loading...</dd>
        <dt>Loaded at</dt>
        <dd id="loaded-at">Loading...</dd>
      </dl>
    </main>
    <script>
      document.getElementById("url").textContent = window.location.href;
      document.getElementById("loaded-at").textContent = new Date().toISOString();
    </script>
  </body>
</html>
